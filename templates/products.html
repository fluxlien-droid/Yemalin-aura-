{% extends "base.html" %}{% block content %}<h1>Produits</h1><form class="search"><input name="q" value="{{q}}" placeholder="Rechercher"><button>Rechercher</button></form><div class="grid">{% for p in products %}<article class="card">{% if p.image %}<img src="{{p.image.url}}">{% endif %}<h3>{{p.name}}</h3><p>{{p.price}} FCFA</p><a class="btn" href="/produit/{{p.id}}/">Voir</a></article>{% empty %}<p>Aucun produit trouvé.</p>{% endfor %}</div>{% endblock %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yemalin Aura — Administration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        .login {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            margin: 5px 0;
            font-size: 27px;
        }

        .slogan {
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-size: 17px;
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #222;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #ffe9e9;
            color: #b00020;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login">

    <img
        class="logo"
        src="{{ url_for('static', filename='logo.png') }}"
        alt="Yemalin Aura"
        onerror="this.style.display='none'"
    >

    <h1>Yemalin Aura</h1>

    <div class="slogan">
        Administration
    </div>

    <form id="login-form">

        <input
            id="code"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            placeholder="Code administrateur"
            required
        >

        <button id="button" type="submit">
            🔐 Se connecter
        </button>

    </form>

    <div
        id="error"
        class="error"
    ></div>

    <a
        class="back"
        href="/"
    >
        ← Retour au site
    </a>

</div>


<script>

const form =
    document.getElementById(
        "login-form"
    );

const code =
    document.getElementById(
        "code"
    );

const button =
    document.getElementById(
        "button"
    );

const error =
    document.getElementById(
        "error"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const value =
            code.value.trim();

        if (!value) {
            return;
        }

        button.disabled = true;

        button.textContent =
            "Connexion...";

        error.style.display =
            "none";

        try {

            const response =
                await fetch(
                    "/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            code: value
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.ok) {

                error.textContent =
                    data.message ||
                    "Code incorrect.";

                error.style.display =
                    "block";

                code.value = "";

                code.focus();

                return;
            }

            window.location.href =
                "/admin";

        } catch (e) {

            error.textContent =
                "Impossible de contacter le serveur.";

            error.style.display =
                "block";

        } finally {

            button.disabled = false;

            button.textContent =
                "🔐 Se connecter";
        }
    }
);

</script>

</body>
</html>

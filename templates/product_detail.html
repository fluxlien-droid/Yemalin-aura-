{% extends "base.html" %}{% block content %}<article class="detail">{% if product.image %}<img src="{{product.image.url}}" class="detail-img">{% endif %}<div><h1>{{product.name}}</h1><p>{{product.description}}</p><h2>{{product.price}} FCFA</h2>{% if product.video %}<video controls src="{{product.video.url}}"></video>{% endif %}{% if product.external_link %}<p><a class="btn" href="{{product.external_link}}" target="_blank">Lien du produit</a></p>{% endif %}<a class="btn" href="/produit/{{product.id}}/commander/">Commander</a></div></article>{% endblock %}
